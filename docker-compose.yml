# AutoGenBook — docker-compose
# Pozn.: spouští webové UI (služba `ui`) i klasické CLI (služba `cli`).
#
# Web UI:
#   docker compose up -d ui
#   otevři http://localhost:8082
#
# CLI:
#   docker compose run --rm cli --help
#   docker compose run --rm cli --mode book --input input/book/book_input.txt --out-dir output/out_book
#
# Sdílené složky (projects/, input/, output/) žijí na hostu a přežijí restart.
services:
  ui:
    build: .
    image: autogenbook:latest
    entrypoint: []
    command: ["python", "-m", "uvicorn", "webui.server:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8082:8080"
    volumes:
      - ./projects:/app/projects
      - ./input:/app/input
      - ./output:/app/output
    env_file:
      - .env

  cli:
    build: .
    image: autogenbook:latest
    profiles: ["cli"]
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./projects:/app/projects
    env_file:
      - .env
