<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoGenBook</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f4f6fb; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #1f2430;
  }
  .card {
    width: 340px; padding: 28px; background: #fff; border-radius: 14px;
    box-shadow: 0 10px 30px rgba(20,40,90,.12);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #7a8296; font-size: 13px; margin: 0 0 20px; }
  input {
    width: 100%; padding: 11px 12px; border: 1px solid #d4d9e4; border-radius: 8px;
    font-size: 14px; margin-bottom: 14px;
  }
  button {
    width: 100%; padding: 11px; border: 0; border-radius: 8px; cursor: pointer;
    background: #2f6feb; color: #fff; font-size: 14px; font-weight: 600;
  }
  button:hover { background: #245ac4; }
  .err { color: #d33; font-size: 13px; margin: 0 0 12px; display: none; }
  .lang {
    position: fixed; top: 14px; right: 16px; background: transparent; border: 1px solid #c8cede;
    color: #3b4356; width: auto; padding: 6px 12px; font-weight: 500; border-radius: 20px;
  }
</style>
</head>
<body>
  <button class="lang" onclick="toggle()" id="lang">🌐 EN</button>
  <div class="card">
    <h1 id="t-title">AutoGenBook</h1>
    <p class="sub" id="t-sub">Zadej heslo pro vstup do aplikace.</p>
    <form method="post" action="/login">
      <input type="password" id="pw" name="password" autocomplete="current-password"
             placeholder="Heslo" autofocus required>
      <p class="err" id="err" style="{{error_style}}">Nesprávné heslo.</p>
      <button type="submit" id="t-btn">Přihlásit se</button>
    </form>
  </div>
<script>
var EN = { sub: "Enter the password to access the app.", ph: "Password", btn: "Log in", err: "Wrong password." };
var CZ = { sub: "Zadej heslo pro vstup do aplikace.", ph: "Heslo", btn: "Přihlásit se", err: "Nesprávné heslo." };
var en = false;
function toggle(){
  en = !en;
  var m = en ? EN : CZ;
  document.getElementById("t-sub").textContent = m.sub;
  document.getElementById("pw").placeholder = m.ph;
  document.getElementById("t-btn").textContent = m.btn;
  document.getElementById("err").textContent = m.err;
  document.getElementById("lang").textContent = en ? "🌐 CS" : "🌐 EN";
}
</script>
</body>
</html>
